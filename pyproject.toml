[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mlops-project"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "docker",
    "ipykernel>=7.4.0",
    "joblib",
    "numpy",
    "pandas",
    "pytest",
    "requests",
    "scikit-learn>=1.9.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
